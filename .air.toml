root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main.exe"
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  delay = 500
  exclude_dir = ["tmp", "vendor", "docs", "supabase"]
  exclude_regex = ["_templ.go", "htmx.min.js"]
  include_ext = ["go", "templ", "css", "js"]
  pre_cmd = ["templ generate"]
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
